

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} | ShopEasy</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        nav {
            background: #172554;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        nav h2 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
        }

        .container {
            max-width: 1000px;
            margin: 45px auto;
            padding: 20px;
        }

        .product-card {
            background: white;
            border-radius: 14px;
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
            align-items: center;
            box-shadow: 0 5px 20px #0000000d;
        }

        .product-image {
            width: 100%;
            height: 350px;
            object-fit: contain;
            background: #f8fafc;
            border-radius: 10px;
        }

        .category {
            color: #64748b;
            text-transform: capitalize;
        }

        .price {
            color: #0f766e;
            font-size: 28px;
            font-weight: bold;
        }

        .description {
            line-height: 1.7;
            color: #475569;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 7px;
            text-decoration: none;
            margin: 8px 8px 0 0;
            font-weight: bold;
        }

        .add-button {
            background: #2563eb;
            color: white;
        }

        .back-button {
            background: #e2e8f0;
            color: #1e293b;
        }

        @media (max-width: 650px) {
            .product-card {
                grid-template-columns: 1fr;
                padding: 20px;
            }

            .product-image {
                height: 260px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>ShopEasy</h2>
        <div>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'cart_view' %}">My Cart</a>
        </div>
    </nav>

    <div class="container">
        <div class="product-card">

            <div>
                {% if product.display_image_url %}
                    <img
                        src="{{ product.display_image_url }}"
                        alt="{{ product.name }}"
                        class="product-image"
                    >
                {% else %}
                    <div class="product-image">
                        Image not available
                    </div>
                {% endif %}
            </div>

            <div>
                <p class="category">{{ product.category }}</p>

                <h1>{{ product.name }}</h1>

                <p class="price">₹{{ product.price }}</p>

                <p class="description">
                    {{ product.description }}
                </p>

               
<form method="POST" action="{% url 'add_to_cart' product.id %}">
    {% csrf_token %}
    <button type="submit" class="button add-button">
        Add to Cart
    </button>
</form>


                <a
                    href="{% url 'home' %}"
                    class="button back-button"
                >
                    Back to Products
                </a>
            </div>

        </div>
    </div>

</body>
</html>
