
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | ShopEasy</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #dbeafe, #eff6ff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
            color: #1e293b;
        }

        .register-card {
            width: 100%;
            max-width: 440px;
            padding: 32px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(23, 37, 84, 0.10);
        }

        .brand {
            margin-bottom: 25px;
            text-align: center;
        }

        .brand h1 {
            margin: 0 0 8px;
            color: #172554;
            font-size: 30px;
        }

        .brand p {
            margin: 0;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }

        .register-card h2 {
            margin: 0 0 22px;
            color: #172554;
            font-size: 23px;
            text-align: center;
        }

        form p {
            margin: 0 0 16px;
        }

        form label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        form input {
            display: block;
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #ffffff;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        form input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .error-box {
            margin-bottom: 18px;
            padding: 12px 14px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            color: #b91c1c;
            font-size: 13px;
            line-height: 1.6;
        }

        .error-box h3 {
            margin: 0 0 8px;
            font-size: 14px;
        }

        .error-box ul {
            margin: 0;
            padding-left: 20px;
        }

        form ul.errorlist {
            margin: 6px 0;
            padding-left: 18px;
            color: #dc2626;
            font-size: 12px;
        }

        .helptext {
            display: block;
            margin-top: 6px;
            color: #64748b;
            font-size: 12px;
            line-height: 1.5;
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #172554;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #243b75;
        }

        .login-text {
            margin: 22px 0 16px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            color: #475569;
            font-size: 14px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="register-card">

        <div class="brand">
            <h1>ShopEasy</h1>
            <p>Create your account and start exploring.</p>
        </div>

        <h2>Create Your Account</h2>

        <form method="POST">
            {% csrf_token %}

            {% if form.errors %}
                <div class="error-box">
                    <h3>Please correct these errors:</h3>
                    {{ form.errors }}
                </div>
            {% endif %}

            {{ form.as_p }}

            <button type="submit">Create Account</button>
        </form>

        <p class="login-text">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </p>

        <a href="{% url 'home' %}" class="back-home">
            ← Back to Home
        </a>

    </div>
</body>
</html>
