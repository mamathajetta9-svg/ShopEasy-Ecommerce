
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ShopEasy</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #dbeafe, #eff6ff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1e293b;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(23, 37, 84, 0.10);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand h1 {
            margin: 0 0 8px;
            color: #172554;
            font-size: 30px;
        }

        .brand p {
            margin: 0;
            color: #64748b;
            font-size: 14px;
        }

        .login-card h2 {
            margin: 0 0 22px;
            text-align: center;
            color: #172554;
            font-size: 23px;
        }

        form p {
            margin: 0 0 18px;
        }

        form label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        form input {
            display: block;
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        form input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        form ul.errorlist {
            color: #dc2626;
            font-size: 13px;
            padding-left: 18px;
        }

        button {
            width: 100%;
            margin-top: 5px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #172554;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #243b75;
        }

        .register-text {
            margin: 22px 0 15px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            color: #475569;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="login-card">

        <div class="brand">
            <h1>ShopEasy</h1>
            <p>Your favorite products, all in one place.</p>
        </div>

        <h2>Welcome Back!</h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Login to Your Account</button>
        </form>

        <p class="register-text">
            Don't have an account?
            <a href="{% url 'register' %}">Create Account</a>
        </p>

        <a href="{% url 'home' %}" class="back-home">
            ← Back to Home
        </a>

    </div>
</body>
</html>
